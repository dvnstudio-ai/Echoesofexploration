name: Import Echoes of Exploration

on:
  push:
    paths:
      - ".github/workflows/import-echoes.yml"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil

          archive = Path("Echoes-of-Exploration-NASA-2026-Dossier-Integrated.zip")
          if not archive.is_file():
              raise SystemExit("Expected project ZIP is missing")

          temp = Path("/tmp/echoes-import")
          shutil.rmtree(temp, ignore_errors=True)
          temp.mkdir(parents=True)

          with ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
              z.extractall(temp)

          source = temp / "echoes"
          if not (source / "package.json").is_file():
              raise SystemExit("Archive does not contain echoes/package.json")

          for item in source.iterdir():
              target = Path(item.name)
              if target.exists() and target.is_dir():
                  shutil.rmtree(target)
              elif target.exists() or target.is_symlink():
                  target.unlink()
              if item.is_dir():
                  shutil.copytree(item, target, symlinks=False)
              else:
                  shutil.copy2(item, target)

          archive.unlink()
          PY

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted project changes to commit."
          else
            git commit -m "Import Echoes of Exploration project source"
            git push origin HEAD:main
          fi
